{{ if .Params.math }}
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.19/dist/katex.min.css"
  integrity="sha384-7lU0muIg/i1plk7MgygDUp3/bNRA65orrBub4/OSWHECgwEsY83HaS1x3bljA/XV"
  crossorigin="anonymous"
/>

<!-- The loading of KaTeX is deferred to speed up page rendering -->
<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.19/dist/katex.min.js"
  integrity="sha384-RdymN7NRJ+XoyeRY4185zXaxq9QWOOx3O7beyyrRK4KQZrPlCDQQpCu95FoCGPAE"
  crossorigin="anonymous"
></script>

<!-- To automatically render math in text elements, include the auto-render extension: -->
<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.19/dist/contrib/auto-render.min.js"
  integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh"
  crossorigin="anonymous"
></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    renderMathInElement(document.body, {
      delimiters: [
        { left: "$$", right: "$$", display: true }, // 블록 수식
        { left: "$", right: "$", display: false }, // 인라인 수식
      ],
      throwOnError: false,
    });
  });
</script>

<script>
  window.WebFontConfig = {
    custom: {
      families: [
        "KaTeX_AMS",
        "KaTeX_Caligraphic:n4,n7",
        "KaTeX_Fraktur:n4,n7",
        "KaTeX_Main:n4,n7,i4,i7",
        "KaTeX_Math:i4,i7",
        "KaTeX_Script",
        "KaTeX_SansSerif:n4,n7,i4",
        "KaTeX_Size1",
        "KaTeX_Size2",
        "KaTeX_Size3",
        "KaTeX_Size4",
        "KaTeX_Typewriter",
      ],
    },
  };
</script>
<script
  defer
  src="https://cdn.jsdelivr.net/npm/webfontloader@1.6.28/webfontloader.js"
  integrity="sha256-4O4pS1SH31ZqrSO2A/2QJTVjTPqVe+jnYgOWUVr7EEc="
